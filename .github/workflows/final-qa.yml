permissions:
  contents: read
  pull-requests: write

name: Final QA

on:
  push:
  pull_request:

jobs:
  static-qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Expo config validation
        run: npx expo@51 config --type public > /dev/null

      - name: TypeScript check
        id: tsc
        shell: bash
        run: |
          set +e
          npx tsc --noEmit --pretty false 2>&1 | tee /tmp/tsc.log
          status=${PIPESTATUS[0]}
          exit ${status}

      - name: Report TypeScript errors to PR
        if: failure() && steps.tsc.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            const body = fs.existsSync('/tmp/tsc.log') ? fs.readFileSync('/tmp/tsc.log', 'utf8') : 'No TypeScript log captured.'
            const comment = [
              '### Temporary TypeScript smoke-test report',
              '',
              '```text',
              body.slice(0, 12000),
              '```',
            ].join('\n')
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: comment,
            })

      - name: Web bundle smoke test
        run: npx expo@51 export --platform web --output-dir .expo-web-smoke

      - name: Parse TypeScript source
        run: npx prettier@3 App.tsx --parser typescript > /dev/null

      - name: Parse and normalize config source
        run: npx prettier@3 --write app.json package.json babel.config.js index.js > /dev/null

      - name: Validate JSON
        run: node -e "JSON.parse(require('fs').readFileSync('app.json','utf8')); JSON.parse(require('fs').readFileSync('package.json','utf8')); console.log('JSON OK')"

      - name: Run dependency audit
        run: node qa/dependency-audit.mjs

      - name: Run product QA assertions
        run: node qa/static-qa.mjs
