name: Final QA

on:
  push:
  pull_request:

permissions:
  contents: read
  issues: write

jobs:
  static-qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Expo config smoke test
        run: npx expo config --type public > /dev/null

      - name: Expo web bundle smoke test
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          npx expo export --platform web > expo-export.log 2>&1
          status=$?
          if [ $status -ne 0 ]; then
            {
              echo "## Expo web export failure"
              echo
              echo "- Run: $GITHUB_RUN_ID"
              echo "- Commit: $GITHUB_SHA"
              echo
              echo '```text'
              cat expo-export.log
              echo '```'
            } > expo-export-diagnostic.md
            gh issue comment 16 --repo "$GITHUB_REPOSITORY" --body-file expo-export-diagnostic.md
            cat expo-export.log
            exit $status
          fi
          cat expo-export.log

      - name: Parse TypeScript source
        run: npx prettier@3 App.tsx --parser typescript > /dev/null

      - name: Parse and normalize config source
        run: npx prettier@3 --write app.json package.json babel.config.js index.js > /dev/null

      - name: Validate JSON
        run: node -e "JSON.parse(require('fs').readFileSync('app.json','utf8')); JSON.parse(require('fs').readFileSync('package.json','utf8')); console.log('JSON OK')"

      - name: Run dependency audit
        run: node qa/dependency-audit.mjs

      - name: Run product QA assertions
        run: node qa/static-qa.mjs
